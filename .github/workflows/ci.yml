name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Set global defaults for the test execution context
  DATABASE_NAME: book_store_test
  DB_USER: runner
  DB_HOST: 127.0.0.1

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: runner
          POSTGRES_DB: book_store_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install

      - name: Seed database schema
        run: |
          psql -h 127.0.0.1 -U runner book_store_test -f seeds/books.sql
          psql -h 127.0.0.1 -U runner book_store_test -f seeds/films.sql
          psql -h 127.0.0.1 -U runner book_store_test -f seeds/users.sql

      - name: Run tests
        env:
          DATABASE_NAME: book_store_test
          DB_USER: runner
          DB_HOST: 127.0.0.1
        run: |
          pytest