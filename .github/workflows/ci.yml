name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call: # This allows deploy.yml to link directly to this workflow

# Cleans up that GitHub runner warning
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: runner
          POSTGRES_DB: book_store_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install

      - name: Seed database
        run: |
          psql -h 127.0.0.1 -U runner book_store_test -f seeds/books.sql
          psql -h 127.0.0.1 -U runner book_store_test -f seeds/users.sql

      - name: Start web app
        run: nohup python app.py > app.log 2>&1 &

      - name: Run tests
        env:
          DATABASE_HOST: 127.0.0.1
          DATABASE_NAME: book_store_test
          DATABASE_USER: runner
          DATABASE_PASSWORD: ""
          DATABASE_PORT: 5432
        run: |
          pytest
