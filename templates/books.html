<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.css">
    <style>
    .book-grid{
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 18px;
    }

    .book-card{
        border: 1px solid #c618bb;
        padding: 10px;
        border-radius: 8px;
        text-align: center;
    }

    .thumbnail{
        width: 100%;
        height: 150px;
        background-color: #12399c;
        margin-bottom: 10px;
    }
</style>
</head>
<body>

<h1>Our Books</h1>

<form method="POST" action="/books">
    <input type="text" name="title" placeholder="Title" required><br>
    <input type="text" name="author" placeholder="Author" required><br>
    <button type="submit">Submit</button>
</form>

<div class="book-grid">
    {% for book in books %}
        <div class="book-card">
            <div class="thumbnail"></div>
            <h3>{{ book.title }}</h3>
            <p>{{ book.author }}</p>
        </div>
    {% endfor %}
</div>

</body>
</html>
